services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentry}
      POSTGRES_USER: ${POSTGRES_USER:-sentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentry-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sentry} -d $${POSTGRES_DB:-sentry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sentry-auth:
    build:
      context: .
      args:
        MODULE: sentry-auth
        PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
    environment: &app-env
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentry}
      DB_USERNAME: ${POSTGRES_USER:-sentry}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sentry-local}
      SENTRY_ADMIN_USERNAME: ${SENTRY_ADMIN_USERNAME:-admin}
      SENTRY_ADMIN_EMAIL: ${SENTRY_ADMIN_EMAIL:-admin@sentry.local}
      SENTRY_ADMIN_PASSWORD: ${SENTRY_ADMIN_PASSWORD:-}
      SENTRY_ISSUER_URL: ${SENTRY_ISSUER_URL:-http://localhost:8081}
      SENTRY_LOGIN_URL: ${SENTRY_LOGIN_URL:-http://localhost:5173/login}
      SENTRY_JWT_SIGNING_KEY: ${SENTRY_JWT_SIGNING_KEY:-}
      SENTRY_JWT_PREVIOUS_KEY: ${SENTRY_JWT_PREVIOUS_KEY:-}
      # ambiente local: sem chave configurada, gera uma temporária a cada subida (RN-F1-07.4)
      SENTRY_JWT_GENERATE_IF_MISSING: ${SENTRY_JWT_GENERATE_IF_MISSING:-true}
      # LDAP que confere a senha dos usuários LDAP; sem url, fica desligado (RN-F1-02.7)
      SENTRY_LDAP_URL: ${SENTRY_LDAP_URL:-}
      SENTRY_LDAP_BASE: ${SENTRY_LDAP_BASE:-}
      SENTRY_LDAP_USER_DN_PATTERN: ${SENTRY_LDAP_USER_DN_PATTERN:-uid={0},ou=people}
      SENTRY_LDAP_USER_SEARCH_BASE: ${SENTRY_LDAP_USER_SEARCH_BASE:-}
      SENTRY_LDAP_USER_SEARCH_FILTER: ${SENTRY_LDAP_USER_SEARCH_FILTER:-}
      SENTRY_LDAP_MANAGER_DN: ${SENTRY_LDAP_MANAGER_DN:-}
      SENTRY_LDAP_MANAGER_PASSWORD: ${SENTRY_LDAP_MANAGER_PASSWORD:-}
      # SPRING_PROFILES_ACTIVE=dev aplica os dados de exemplo (db/dev), usados por examples/spa
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  sentry-backend:
    build:
      context: .
      args:
        MODULE: sentry-backend
        PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
