<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exemplo de SPA com o Sentry</title>
    <style>
        body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
        button { font: inherit; padding: 8px 16px; margin-right: 8px; }
        pre { background: #f4f5f7; padding: 12px; overflow-x: auto; }
    </style>
</head>
<body>
<h1>Exemplo de SPA</h1>
<p>Login no Sentry pelo fluxo Authorization Code + PKCE, com a biblioteca genérica
    <a href="https://github.com/authts/oidc-client-ts">oidc-client-ts</a> configurada só com o issuer e o client_id.</p>
<button id="login">Entrar</button>
<button id="logout" hidden>Sair</button>
<h2 id="title" hidden>Usuário autenticado</h2>
<pre id="profile" hidden></pre>
<p id="error" role="alert"></p>

<script src="https://cdn.jsdelivr.net/npm/oidc-client-ts@3.1.0/dist/browser/oidc-client-ts.min.js"></script>
<script>
    // ajuste o issuer se o sentry-auth não estiver em http://localhost:8081
    const manager = new oidc.UserManager({
        authority: "http://localhost:8081",
        client_id: "SYS001",
        redirect_uri: "http://127.0.0.1:3000/",
        post_logout_redirect_uri: "http://127.0.0.1:3000/",
        scope: "openid profile email",
        loadUserInfo: true
    });

    function show(user) {
        const loggedIn = Boolean(user);
        document.getElementById("login").hidden = loggedIn;
        document.getElementById("logout").hidden = !loggedIn;
        document.getElementById("title").hidden = !loggedIn;
        document.getElementById("profile").hidden = !loggedIn;
        document.getElementById("profile").textContent = loggedIn ? JSON.stringify(user.profile, null, 2) : "";
    }

    document.getElementById("login").onclick = () => manager.signinRedirect();
    document.getElementById("logout").onclick = () => manager.signoutRedirect();

    (async () => {
        try {
            const params = new URLSearchParams(location.search);
            if (params.has("code")) {
                await manager.signinRedirectCallback();
                history.replaceState({}, "", location.pathname);
            } else if (params.has("state")) {
                await manager.signoutRedirectCallback();
                history.replaceState({}, "", location.pathname);
            }
            show(await manager.getUser());
        } catch (e) {
            document.getElementById("error").textContent = "Erro: " + e.message;
        }
    })();
</script>
</body>
</html>
