spring:
  application:
    name: sentry-auth
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  # RN-F1-09.4: sessão SSO no PostgreSQL; as tabelas vêm da migração V2
  session:
    jdbc:
      initialize-schema: never

server:
  port: 8081
  # RN-F1-10.4: X-Forwarded-For só vale vindo de proxy confiável; o Tomcat aceita, por padrão, só proxies de redes
  # privadas (ajuste em server.tomcat.remoteip.internal-proxies)
  forward-headers-strategy: native
  # RN-F1-09.2: a sessão SSO expira sem uso (o cookie é configurado em SessionCookieConfiguration)
  servlet:
    session:
      timeout: ${SENTRY_SESSION_IDLE_TIMEOUT:30m}

# só /actuator/health, com liveness e readiness, usado pelo healthcheck do Compose (RN-F0-04.4)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

sentry:
  # URL pública do sentry-auth, usada como issuer dos tokens a partir da F1-07 (RN-F0-04.5)
  issuer-url: ${SENTRY_ISSUER_URL:http://localhost:8081}
  # tela de login do front-end (React), servida na mesma origem do sentry-auth por um proxy (F1-04)
  login-url: ${SENTRY_LOGIN_URL:http://localhost:5173/login}
  # RN-F1-09.2: vida máxima da sessão SSO, mesmo com uso
  session:
    max-age: ${SENTRY_SESSION_MAX_AGE:12h}
  # LDAP que confere a senha dos usuários LDAP; sem url, fica desligado (RN-F1-02.7). Use ldaps:// em produção
  ldap:
    url: ${SENTRY_LDAP_URL:}
    base: ${SENTRY_LDAP_BASE:}
    user-dn-pattern: ${SENTRY_LDAP_USER_DN_PATTERN:uid={0},ou=people}
    # Active Directory: com filtro, a conta de serviço busca o usuário e o bind usa o DN encontrado
    user-search-base: ${SENTRY_LDAP_USER_SEARCH_BASE:}
    user-search-filter: ${SENTRY_LDAP_USER_SEARCH_FILTER:}
    manager-dn: ${SENTRY_LDAP_MANAGER_DN:}
    manager-password: ${SENTRY_LDAP_MANAGER_PASSWORD:}
    connect-timeout: ${SENTRY_LDAP_CONNECT_TIMEOUT:5s}
    read-timeout: ${SENTRY_LDAP_READ_TIMEOUT:5s}

# RN-F1-10.7: log estruturado em JSON
logging:
  structured:
    format:
      console: ecs
