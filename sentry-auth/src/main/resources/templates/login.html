<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{login.title} + ' · ' + #{brand}">Entrar · Sentry</title>
    <link rel="stylesheet" th:href="@{/css/sentry.css}">
</head>
<body>
<main class="card">
    <p class="brand" th:text="#{brand}">Sentry</p>
    <h1 th:if="${systemName}" th:text="#{login.system(${systemName})}">Para continuar em Portal</h1>
    <h1 th:unless="${systemName}" th:text="#{login.heading}">Entre na sua conta</h1>

    <p th:if="${error}" id="login-error" class="error" role="alert" th:text="#{login.error}">
        Usuário ou senha inválidos</p>

    <form method="post" th:action="@{/login}">
        <label for="username" th:text="#{login.username}">Usuário</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none"
               spellcheck="false" required autofocus th:value="${username}"
               th:attrappend="aria-describedby=${error} ? 'login-error'">

        <label for="password" th:text="#{login.password}">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               th:attrappend="aria-describedby=${error} ? 'login-error'">

        <button type="submit" th:text="#{login.submit}">Entrar</button>
    </form>
</main>
</body>
</html>
